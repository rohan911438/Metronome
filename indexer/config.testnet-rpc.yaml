# yaml-language-server: $schema=./node_modules/envio/evm.schema.json
# Metronome on Monad testnet over the public RPC: no HyperSync token needed, slower first sync (public RPCs cap
# eth_getLogs at 100-1,000 blocks). With a token use config.yaml. Run with Docker: see README.md.
name: metronome
description: Metronome batch-auction exchange
contracts:
  - name: Metronome
    events:
      - event: "OrderPlaced(bytes32 indexed orderId, address indexed owner, uint256 indexed batchId, bool isBuy, bool resting, uint16 tick, uint128 size, uint128 escrow, uint256 shard)"
      - event: "BatchSettled(uint256 indexed batchId, uint16 clearingTick, uint256 price, uint128 volume, uint8 rationed, uint128 fillNum, uint128 fillDen, bool voided)"
      - event: "PoolUpdated(bool indexed isBuy, uint16 indexed tick, uint32 gen, uint128 remaining)"
      - event: "Claimed(bytes32 indexed orderId, address indexed owner, uint256 baseOut, uint256 quoteOut, bool closed)"
      - event: "OrderCancelled(bytes32 indexed orderId, address indexed owner, uint256 baseOut, uint256 quoteOut)"
      - event: "SettleRewardPaid(uint256 indexed batchId, address indexed settler, uint256 amount)"
chains:
  - id: 10143
    start_block: 65622114 # first WMON/AUSD market (v2) deploy block
    rpc:
      # thirdweb's public endpoint answers 1,000 blocks per eth_getLogs, 10x the official RPC; that one is the fallback.
      - url: https://10143.rpc.thirdweb.com
        for: sync
        initial_block_interval: 1000
        interval_ceiling: 1000
      - url: https://testnet-rpc.monad.xyz
        for: fallback
        initial_block_interval: 100
        interval_ceiling: 100
    contracts:
      - name: Metronome
        address:
          - "0x44F6cF1A3c61AfCeAfF5017CA054b5754C2110E5" # WMON/AUSD with the price band (Oct 4), current
          - "0x99E4DBCF8edE8092Be972307eB3d0Cd91ecBa889" # WMON/AUSD v2 (Sep 25 - Oct 4), same pair and events
